<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
        integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="../images/static/logo.png" />
    <link rel="stylesheet" href="../css/allcommon.css" />
    <link rel="stylesheet" href="../css/myBootstrap.css" />
    <title>IndexedDB Demo</title>
    <meta name="description" content="IndexedDB demo page for ElateFit." />
    <meta name="keywords" content="indexeddb, elatefit, demo" />
    <meta name="author" content="elatefit" />
    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .page-content {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <header>
        <div id="navBarContainer">
            <button type="button" class="btn-warning" id="toggleBtn">
                <i class="fa-sharp fa-solid fa-bars"></i>
            </button>
            <iframe id="searchbar" src="../fragsearchbar.html" loading="lazy"></iframe>
        </div>
        <iframe id="navframe" src="../fragnav.html" loading="lazy"></iframe>
    </header>

    <main class="page-content">
        <h1>Workout Tracker</h1>
        <p>Track your shoulder press workout counts using IndexedDB.</p>

        <div class="card p-3 mb-3">
            <h3>Shoulder Press Workout</h3>
            <div class="mb-3">
                <label for="workoutCount" class="form-label">Count</label>
                <input type="number" id="workoutCount" class="form-control" min="0" step="1" value="0" />
            </div>
            <div class="d-flex gap-2">
                <button type="button" id="saveWorkoutBtn" class="btn btn-primary">Save Count</button>
                <button type="button" id="resetWorkoutBtn" class="btn btn-outline-secondary">Reset</button>
            </div>
            <div class="mt-3">
                <strong>Saved Shoulder Press Count:</strong>
                <span id="savedWorkoutCount">0</span>
            </div>
        </div>
    </main>

    <footer>
        <iframe id="footer" src="../fragfooter.html" loading="lazy"></iframe>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.1.js"
        integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI=" crossorigin="anonymous"></script>
    <script src="../js/allcommon.js"></script>
    <script src="indexdb.js"></script>
</body>

</html>
