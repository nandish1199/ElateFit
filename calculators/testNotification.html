<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Google Calendar Reminder</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #26343a;
            --muted: #68777a;
            --teal: #167b78;
            --line: #dce7e3;
            --paper: #fbfcfa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
            background: linear-gradient(135deg, #e5f3f0, #fff8f3);
            color: var(--ink);
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        main {
            width: min(100%, 520px);
            padding: 28px;
            border: 1px solid var(--line);
            border-top: 4px solid var(--teal);
            background: var(--paper);
            box-shadow: 0 14px 35px rgba(25, 66, 65, .12);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.5rem, 5vw, 2.1rem);
        }

        p {
            color: var(--muted);
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 18px;
            color: var(--muted);
            font-size: .9rem;
            font-weight: 700;
        }

        input,
        textarea,
        button {
            width: 100%;
            margin-top: 7px;
            padding: 11px 12px;
            border: 1px solid #b9cbc7;
            border-radius: 4px;
            font: inherit;
        }

        input,
        textarea {
            background: #fff;
            color: var(--ink);
        }

        textarea {
            min-height: 84px;
            resize: vertical;
        }

        button {
            min-height: 44px;
            border-color: #757575;
            background: #757575;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        button:hover {
            background: #616161;
        }

        #status {
            min-height: 24px;
            margin: 16px 0 0;
            color: var(--teal);
            font-weight: 600;
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            border-left: 3px solid #d86d59;
            background: #fff3ee;
            color: #875044;
            font-size: .85rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>Add Google Calendar Reminder</h1>
        <p>Fill in the reminder details. Google Calendar will open with the event ready for you to save.</p>

        <label for="title">Title
            <input id="title" type="text" value="Workout" maxlength="120" />
        </label>

        <label for="details">Details
            <textarea id="details">Time for your daily workout.</textarea>
        </label>

        <label for="location">Location
            <input id="location" type="text" />
        </label>

        <label for="start">Start date and time
            <input id="start" type="datetime-local" required />
        </label>

        <label for="end">End date and time
            <input id="end" type="datetime-local" required />
        </label>

        <button type="button" id="addButton">Add to Google Calendar</button>
        <p id="status" role="status" aria-live="polite"></p>
        <div class="note">No OAuth or API key is required. You must click “Save” in Google Calendar after this page
            opens. The template method cannot delete events automatically.</div>
    </main>

    <script>
        const titleInput = document.getElementById("title");
        const detailsInput = document.getElementById("details");
        const locationInput = document.getElementById("location");
        const startInput = document.getElementById("start");
        const endInput = document.getElementById("end");
        const statusElement = document.getElementById("status");

        function toGoogleDate(value) {
            const [date, time] = value.split("T");
            return date.replaceAll("-", "") + "T" + time.replaceAll(":", "") + "00";
        }

        function setDefaultTimes() {
            const start = new Date(Date.now() + 60 * 60 * 1000);
            start.setMinutes(Math.ceil(start.getMinutes() / 30) * 30, 0, 0);
            const end = new Date(start.getTime() + 60 * 60 * 1000);
            const toInputValue = date => {
                const offset = date.getTimezoneOffset() * 60000;
                return new Date(date.getTime() - offset).toISOString().slice(0, 16);
            };
            startInput.value = toInputValue(start);
            endInput.value = toInputValue(end);
        }

        function addWorkoutReminder() {
            if (!startInput.value || !endInput.value) {
                statusElement.textContent = "Choose both a start and end time.";
                return;
            }

            const start = new Date(startInput.value);
            const end = new Date(endInput.value);
            if (end <= start) {
                statusElement.textContent = "The end time must be after the start time.";
                return;
            }

            const calendarUrl =
                "https://calendar.google.com/calendar/r/eventedit" +
                "?action=TEMPLATE" +
                "&text=" + encodeURIComponent(titleInput.value.trim() || "ElateFit reminder") +
                "&dates=" + toGoogleDate(startInput.value) + "/" + toGoogleDate(endInput.value) +
                "&details=" + encodeURIComponent(detailsInput.value.trim()) +
                "&location=" + encodeURIComponent(locationInput.value.trim()) +
                "&ctz=" + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata");

            window.open(calendarUrl, "_blank", "noopener");
            statusElement.textContent = "Google Calendar opened. Select Save to add the reminder.";
        }

        document.getElementById("addButton").addEventListener("click", addWorkoutReminder);
        setDefaultTimes();
    </script>
</body>

</html>
