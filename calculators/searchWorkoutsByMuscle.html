<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
        integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="../images/static/logo.png" />
    <link rel="stylesheet" href="../css/allcommon.css" />
    <link rel="stylesheet" href="../css/searchWorkoutsByMuscle.css" />
    <title>Search Workouts by Muscle, Elatefit</title>
</head>

<body>
    <div id="navBarContainer"><button type="button" class="btn-warning" id="toggleBtn"><i
                class="fa-sharp fa-solid fa-bars"></i></button><iframe id="searchbar" src="../fragsearchbar.html"
            loading="lazy"></iframe></div>
    <iframe id="navframe" src="../fragnav.html" loading="lazy"></iframe>
    <main class="exercisePage">
        <section class="exerciseHero">
            <h1>FIND YOUR NEXT EXERCISE</h1>
            <p>Search by muscle group, equipment, or difficulty. Every exercise includes a space for your future workout
                image and clear instructions to help you train with intention.</p>
        </section>
        <div class="exerciseLayout">
            <aside class="exercisePanel">
                <h2>Filter library</h2>
                <div class="filterStack">
                    <label class="filterLabel" for="exerciseSearch">Search exercises<input type="search"
                            id="exerciseSearch" placeholder="Try shoulder or squat" autocomplete="off" /></label>
                    <label class="filterLabel" for="equipmentFilter">Equipment<select id="equipmentFilter">
                            <option value="">All equipment</option>
                            <option>Dumbbell</option>
                            <option>Barbell</option>
                            <option>Bodyweight</option>
                            <option>Cable</option>
                            <option>Machine</option>
                        </select></label>
                    <label class="filterLabel" for="difficultyFilter">Difficulty<select id="difficultyFilter">
                            <option value="">All levels</option>
                            <option>Beginner</option>
                            <option>Intermediate</option>
                            <option>Advanced</option>
                        </select></label>
                    <div>
                        <div class="filterLabel">Muscle group</div>
                        <div class="muscleTabs" id="muscleTabs"></div>
                    </div>
                </div>
            </aside>
            <section class="exercisePanel">
                <div class="resultToolbar">
                    <h2>Exercise library</h2><span class="resultCount" id="resultCount"></span>
                </div>
                <div class="exerciseGrid" id="exerciseGrid"></div>
            </section>
        </div>
    </main>
    <iframe id="footer" src="../fragfooter.html" loading="lazy"></iframe>
    <script src="https://code.jquery.com/jquery-3.6.1.js"
        integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI=" crossorigin="anonymous"></script>
    <script src="../js/allcommon.js"></script>
    <script src="../js/searchWorkoutsByMuscle.js"></script>
</body>

</html>
